name: build-snapshot
run-name: Build player archives without verification (${{ inputs.targets }})
# Started by hand to get installable archives from a commit whose checks are not clean yet, for example a change that
# has to be measured in a client before its tests are settled. assemble compiles, remaps and jars; it leaves out the
# tests and archive checks that `build` adds through check, and the formatter that only `checkCore` runs. verify.yml
# still judges the commit; this workflow only supplies archives.
on:
  workflow_dispatch:
    inputs:
      targets:
        description: Comma-separated Minecraft targets (1.20.1,1.21.1,26.1.2,26.2,26.3)
        required: true
        default: 1.20.1,1.21.1,26.1.2,26.2,26.3
        type: string
      revision:
        description: Commit to build; empty builds the selected branch
        required: false
        type: string

permissions:
  contents: read

jobs:
  plan:
    name: Resolve the requested targets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - name: Turn the target list into a matrix
        id: targets
        env:
          TARGETS: ${{ inputs.targets }}
        # Adapter directories are the matrix's project names; an unknown target fails here instead of in a build.
        run: |
          node -e '
            const known = {
              "1.20.1": "forge-1.20.1",
              "1.21.1": "neoforge-1.21.1",
              "26.1.2": "neoforge-26.1.2",
              "26.2": "neoforge-26.2",
              "26.3": "neoforge-26.3",
            };
            const targets = process.env.TARGETS.split(",").map(t => t.trim()).filter(Boolean);
            const unknown = targets.filter(t => !(t in known));
            if (unknown.length) throw new Error("Unknown targets: " + unknown.join(","));
            const matrix = { include: targets.map(target => ({ target, adapter: known[target] })) };
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, "matrix=" + JSON.stringify(matrix) + "\n");
          '

  build:
    name: Assemble ${{ matrix.adapter }}
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        id: java17
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-java@v4
        id: java21
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-java@v4
        id: java25
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble the adapter's archives
        env:
          COMPIXEL_JDK17: ${{ steps.java17.outputs.path }}
          COMPIXEL_JDK21: ${{ steps.java21.outputs.path }}
          COMPIXEL_JDK25: ${{ steps.java25.outputs.path }}
        run: bash gradlew "-PcompixelTargets=${{ matrix.target }}" ":minecraft:${{ matrix.adapter }}:assemble" --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: snapshot-${{ matrix.adapter }}
          path: minecraft/${{ matrix.adapter }}/build/release/*.jar
          if-no-files-found: error
          compression-level: 0
          overwrite: true
